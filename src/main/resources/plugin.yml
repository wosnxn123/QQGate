name: QQGate
version: "${version}"
main: dev.qqgate.QQGatePlugin
api-version: "1.20"
folia-supported: true
authors: [QQGate]
description: Minecraft <-> QQ binding gate with OneBot 11, Folia/Paper compatible.
commands:
  qqgate:
    description: QQGate player command
    usage: /qqgate help - list player subcommands (bind/info/help)
  qqgateadmin:
    description: QQGate admin command
    usage: /qqgateadmin help - list admin subcommands
    permission: qqgate.admin
permissions:
  qqgate.admin:
    description: Admin command access
    default: op
  qqgate.bypass:
    description: Skip the join bind check (blacklisted QQ/name is still kicked)
    default: false
