name: QQGate
version: "${version}"
main: dev.qqgate.QQGatePlugin
api-version: "1.20"
folia-supported: true
authors: [QQGate]
description: Minecraft <-> QQ binding gate with OneBot 11, Folia/Paper compatible.
commands:
  qqgate:
    description: QQGate player command
    usage: /qqgate <bind|info|help>
  qqgateadmin:
    description: QQGate admin command
    usage: /qqgateadmin <status|codes|lookup|unbind|bind|reload|help>
    permission: qqgate.admin
permissions:
  qqgate.admin:
    description: Admin command access
    default: op
  qqgate.bypass:
    description: Skip bind check on join
    default: op
