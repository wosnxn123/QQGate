# 配置结构版本（自动升级用，勿手改）
config-version: 5

# ============================================================
#  QQGate 配置  |  改完用 /qqgateadmin reload 生效（连接段除外）
#  各段说明：onebot=机器人连接  groups=群  private=私聊  admins=QQ管理员
#            bind=绑定规则  kick=踢出页  messages=回复文案
# ============================================================

# ------------------------------ OneBot 连接 ------------------------------
onebot:
  # 连接模式:
  #   reverse-ws —— 机器人主动连我方（NapCat/LLOneBot 常用，推荐）
  #   forward-ws —— 我方主动连机器人（Lagrange 常用）
  mode: reverse-ws
  listen-host: 0.0.0.0              # reverse-ws 监听地址（机器人同机建议 127.0.0.1，不暴露公网）
  listen-port: 6700                 # reverse-ws 监听端口（防火墙需放行）
  forward-url: "ws://127.0.0.1:3001"  # forward-ws 目标地址
  access-token: ""                  # 鉴权令牌，必须与机器人端一致；留空=不鉴权（公网强烈不建议）
  reconnect-seconds: 5              # forward-ws 断线自动重连间隔（秒）
  heartbeat-timeout-seconds: 60     # 超过该秒数无事件判定机器人离线（OneBot 默认心跳 15s）
  allowed-self-id: 0                # 只信任该机器人QQ号的事件；0 = 不限制（防其他机器人误连）
groups:
  allow-all: false                  # true = 任何群都可执行全部指令（下方白名单失效）；默认 false 只用白名单
  allowed: [123456789]              # 群白名单：只响应这些群的一切指令（allow-all: true 时失效）
  recommended: ""                   # 推荐群：allow-all 开时作为官方入口显示（★推荐 + 或任意群）；
                                   #   白名单模式下不参与显示与功能。留空 = allow-all 时显示"机器人所在任意群"
  reply-in-source-group: true       # 回复发回消息来源的群

# -------------------------------- 私聊 ----------------------------------
private:
  # 私聊总闸：true = 私聊机器人可用全部玩家指令（绑定/查询/解绑/帮助），回执走私聊不刷群。
  # 默认 false = 私聊对普通玩家完全无响应。
  # 不影响管理员：白名单QQ的私聊管理指令由 admins.respond.private 单独控制。
  allow-bind: false

# ------------------------------ QQ 管理员 -------------------------------
admins:
  # QQ 管理员白名单：这些QQ可执行管理员指令；为空 = QQ 侧管理功能整体关闭
  # 指令语法：查/解绑 <目标>/解绑 <名> <QQ>/全解绑 <目标>/绑定 <名> <QQ>/状态/帮助
  qq: []
  respond:
    group: true                     # 群内响应管理员指令
    private: true                   # 私聊响应管理员指令

# ------------------------------- 绑定规则 -------------------------------
bind:
  # ---- 验证码 ----
  code-length: 4                    # 位数（4~8，超范围自动收敛）
  expire-minutes: 5                 # 有效期（分钟，下限 1）；同时显示在踢出页
  expire-display: both              # 有效期显示：both=时长+时刻 | relative=仅时长 | absolute=仅时刻
  time-format: "HH:mm"              # 绝对时刻格式（Java DateTimeFormatter 语法，如 "MM-dd HH:mm"）
  time-zone: "default"              # "default"=跟随服务器时区，或 IANA 名如 "Asia/Shanghai"
  # /qqgate bind 游戏内验证码回显（占位符 {code} {group} {expire_minutes} {expire_time}）
  code-message: "<gold><b>QQGate</b></gold> <dark_gray>»</dark_gray> <yellow>你的验证码：<green><b>绑定 {code}</b></green>\n<gray>发送到群 <aqua>{group}</aqua> 完成绑定，有效期 {expire_minutes} 分钟（{expire_time} 前有效）</gray>"

  # ---- 数量限制 ----
  max-per-qq: 1                     # 一个QQ最多绑几个游戏账号（一人多小号场景）
  max-per-player: 1                 # 一个游戏账号最多绑几个QQ（一号多人/换号场景）
  # 达到上限时：reject=拒绝并提示 | replace=挤掉最早的绑定（自动换绑，玩家换QQ无需先解绑）
  limit-policy: reject

  # ---- 行为 ----
  # 自助解绑开关（群+私聊一起管）：true = 玩家可发「解绑 <自己的账号名>」解绑；
  # 无参「解绑」始终只列列表。false = 解绑指令静默忽略，找管理员处理。
  self-unbind: false
  cooldown-seconds: 10              # 指令冷却（按QQ计，绑定/解绑共享计时，错码也计入，防刷屏）

# -------------------------------- 踢出页 --------------------------------
kick:
  # 断开前延迟（毫秒）。拦截点为 PlayerLoginEvent（客户端已就绪），通常保持 0；
  # 仅当玩家仍偶发看到"连接中断"而非踢出屏时，再试 300~800。
  delay-ms: 0
  # QQ 黑名单玩家的踢出页（名下绑定被拉黑QQ → 直接拒绝）
  banned-message: "<red><b>该QQ已被服务器拉黑，无法进入</b></red>\n<gray>如有异议请联系管理员申诉</gray>"
  # 名字封禁踢出页（同名账号曾绑定被拉黑的QQ）
  name-banned-message: "<red><b>该名称已被封禁，无法进入</b></red>\n<gray>如有异议请联系管理员申诉</gray>"
  # 踢出页文案（\n 换行），占位符:
  #   {code} 验证码  {player} 玩家名  {expire_minutes} 分钟数  {expire_time} 时刻
  #   {expire_line} 组合好的有效期整行（按 expire-display 生成）
  #   {group} 单一群号（推荐群 > 白名单第一个；allow-all 时为提示文本）
  message: "<gold><b>QQGate</b></gold> <dark_gray>|</dark_gray> <red>请加入QQ群绑定后进入服务器</red>\n\n<yellow>➤ 服务器群：<white>{group_line}</white></yellow>\n<yellow>➤ 在群内发送：<green><b>绑定 {code}</b></green></yellow>\n\n<aqua>➤ 绑定成功后重新连接即可进入</aqua>\n<gray>【!】验证码 <white>{expire_minutes}</white> 分钟内有效（{expire_time} 前）\n【!】过期后重新进服即可刷新</gray>"

# -------------------------------- 存储 ----------------------------------
storage:
  file: bindings.json               # 绑定数据文件（相对 plugins/QQGate/，原子写入，可备份）
  pretty-print: true                # JSON 缩进输出，便于人工检查

# ------------------------------- 调试开关 -------------------------------
debug: false                        # true 时控制台输出每条 OneBot 收发帧（排障用，平时关闭防刷屏）

# ------------------------------ 回复文案 --------------------------------
# QQ 指令的回复文案（\n 换行）。群回复自动引用触发消息并 @发送者；私聊为纯文本。
# 占位符: {at}=艾特 {player}=游戏名 {qq}=QQ号 {count}/{max}=已绑/上限
#         {remaining}=还可绑定几个 {old_player}=被挤下的玩家 {seconds}=冷却秒数
#         {target}=查询/解绑目标 {result}/{detail}=代码生成的结果文本
messages:
  # ---- 玩家文案 ----
  bound: "{at} 绑定成功！\n游戏账号：{player}\n该QQ当前已绑定 {count}/{max} 个账号，还可绑定 {remaining} 个\n现在可以重新进入服务器了"
  replaced: "{at} 绑定成功（已自动替换旧绑定，挤下：{old_player}）\n游戏账号：{player}\n该QQ当前已绑定 {count}/{max} 个账号，还可绑定 {remaining} 个"
  already-bound: "{at} 该QQ已绑定游戏账号 {player}，无需重复绑定"       # 重复发已绑过的码
  wrong-code: "{at} 验证码错误或已过期，请重新进入服务器获取"
  code-used: "{at} 该验证码已被使用"                                     # 码刚被别人用过
  qq-full: "{at} 该QQ已绑定满 {max} 个账号（{count}/{max}），请联系管理员"
  player-full: "{at} 该游戏账号已绑定满 {max} 个QQ，请联系管理员"
  cooldown: "{at} 操作太频繁，请 {seconds} 秒后再试"
  not-bound: "{at} 你当前没有绑定任何账号"                               # 查询/解绑时无绑定
  self-unbind-ok: "{at} 已解绑账号 {player}（该QQ还剩 {count} 个绑定）"
  self-unbind-notfound: "{at} 你名下没有名为 {player} 的绑定，发送「解绑」查看列表"
  self-unbind-list: "{at} {result}"                                     # 查询/无参解绑的列表
  qq-banned: "{at} 该QQ已被服务器拉黑，无法绑定；如有异议请联系管理员"
  qqban-ok: "{at} 已拉黑 QQ {qq}{reason_part}{cleared_part}"
  qqunban-ok: "{at} 已解除拉黑 QQ {qq}"
  admin-bind-banned: "{at} ⚠ QQ {qq} 已被拉黑，请先 解拉黑 {qq}"
  qqbans-empty: "{at} QQ 黑名单为空"
  qqbans-list: "{at} {result}"
  help: "{at} 可用指令：\n绑定 <验证码> —— 绑定游戏账号\n查询 —— 查看我的绑定"

  # ---- 管理员文案 ----
  admin-help: "{at} 管理员指令：\n查 <玩家名|QQ号> —— 查询绑定（拉黑QQ带⚠标记）\n解绑 <玩家名|QQ号> —— 解绑（多条会列出）\n解绑 <玩家名> <QQ号> —— 精确解绑\n全解绑 <玩家名|QQ号> —— 清空全部绑定\n绑定 <玩家名> <QQ号> —— 代绑\n拉黑 <QQ号> [原因] —— 拉黑QQ（名下+同名账号全封锁）\n解拉黑 <QQ号> —— 解除拉黑（自动复原）\n拉黑列表 —— 黑名单（含名下账号名）\n状态 —— 连接与统计"
  admin-lookup: "{at} {result}"                                        # 查询结果（{result}为列表）
  admin-lookup-empty: "{at} {target} 未找到绑定"
  admin-unbind-notfound: "{at} {target} 无绑定（或未找到该组合）"
  admin-unbind-exact-ok: "{at} 已解绑 {player} <-> QQ {qq}（还剩 {count} 条）"
  admin-unbind-ambiguous: "{at} {result}"                               # 多条绑定时的选择列表
  admin-unbindall-ok: "{at} 已清空 {target} 名下 {count} 条绑定（{detail}）"
  admin-bind-ok: "{at} 已绑定 {player} <-> QQ {qq}"
  admin-bind-no-player: "{at} 未找到玩家 {player} 的既有绑定记录，无法定位UUID；请让玩家先进服一次，或使用游戏内 /qqgateadmin bind"
  admin-bind-fail: "{at} 绑定失败"
  admin-status: "{at} {result}"                                        # 状态查询结果
